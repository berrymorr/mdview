[package]
name = "mdview"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "A terminal viewer for Markdown: renders the markup instead of showing it"
license = "AGPL-3.0-or-later"
repository = "https://github.com/berrymorr/mdview"
# Not on crates.io, where the name belongs to another program.
publish = false

[dependencies]
ansi_colours = "1.2.3"
clap = { version = "4.6.8", features = ["derive", "wrap_help"] }
comrak = { version = "1.0.0", default-features = false }
libc = "0.2"
shell-words = "1.1.1"
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "regex-onig"] }
terminal_size = "0.4.4"
two-face = { version = "0.5.2", default-features = false, features = ["syntect-onig"] }
unicode-segmentation = "1.13.3"
unicode-width = "0.2.3"

[profile.release]
strip = true
